<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیستم حضور و غیاب NFC</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3b82f6">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            width: 100%;
            max-width: 500px;
        }
        
        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(45deg, #3b82f6, #8b5cf6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 40px;
            color: white;
        }
        
        h1 {
            color: #1f2937;
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #6b7280;
            font-size: 14px;
        }
        
        .status-card {
            background: #f8fafc;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            border: 2px solid #e5e7eb;
        }
        
        .status-title {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 5px;
        }
        
        .status-message {
            font-size: 16px;
            color: #1f2937;
            font-weight: 600;
        }
        
        .status-success {
            border-color: #10b981;
            background: #ecfdf5;
        }
        
        .status-error {
            border-color: #ef4444;
            background: #fef2f2;
        }
        
        .mode-selector {
            display: flex;
            background: #f3f4f6;
            border-radius: 12px;
            padding: 5px;
            margin: 25px 0;
        }
        
        .mode-btn {
            flex: 1;
            padding: 15px;
            text-align: center;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s;
        }
        
        .mode-btn.active {
            background: white;
            color: #3b82f6;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        .scan-btn {
            width: 100%;
            padding: 20px;
            background: linear-gradient(45deg, #3b82f6, #8b5cf6);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
            transition: all 0.3s;
        }
        
        .scan-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
        }
        
        .scan-btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
            transform: none;
        }
        
        .result-card {
            background: #f8fafc;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            border: 2px solid #e5e7eb;
            min-height: 120px;
        }
        
        .result-title {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 10px;
        }
        
        .result-content {
            font-size: 16px;
            color: #1f2937;
        }
        
        .history-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-top: 25px;
            border: 1px solid #e5e7eb;
        }
        
        .history-title {
            font-size: 16px;
            color: #1f2937;
            margin-bottom: 15px;
        }
        
        .log-item {
            padding: 10px;
            border-bottom: 1px solid #f3f4f6;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .log-item:last-child {
            border-bottom: none;
        }
        
        .log-name {
            font-weight: 600;
        }
        
        .log-type {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 500;
        }
        
        .checkin {
            background: #d1fae5;
            color: #065f46;
        }
        
        .checkout {
            background: #fee2e2;
            color: #991b1b;
        }
        
        .log-time {
            font-size: 12px;
            color: #6b7280;
            margin-top: 4px;
        }
        
        .pulse {
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }
        
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-right: 8px;
        }
        
        .badge-success {
            background: #d1fae5;
            color: #065f46;
        }
        
        .badge-error {
            background: #fee2e2;
            color: #991b1b;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .control-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        
        .export-btn {
            background: #10b981;
            color: white;
        }
        
        .clear-btn {
            background: #ef4444;
            color: white;
        }
        
        .test-btn {
            background: #f59e0b;
            color: white;
        }
        
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <!-- هدر -->
            <div class="header">
                <div class="logo">📱</div>
                <h1>سیستم حضور و غیاب NFC</h1>
                <p class="subtitle">ورود و خروج هوشمند با کارت</p>
            </div>
            
            <!-- وضعیت NFC -->
            <div id="nfcStatus" class="status-card">
                <div class="status-title">وضعیت NFC</div>
                <div class="status-message" id="nfcStatusText">در حال بررسی...</div>
            </div>
            
            <!-- انتخاب حالت -->
            <div class="mode-selector">
                <div class="mode-btn active" id="modeCheckin" onclick="setMode('checkin')">
                    🟢 ورود
                </div>
                <div class="mode-btn" id="modeCheckout" onclick="setMode('checkout')">
                    🔴 خروج
                </div>
            </div>
            
            <!-- دکمه اسکن -->
            <button class="scan-btn pulse" id="scanBtn" onclick="startNFCScan()">
                <span id="scanIcon">📲</span>
                <span id="scanText">اسکن کارت NFC</span>
            </button>
            
            <!-- نتیجه اسکن -->
            <div class="result-card">
                <div class="result-title">نتیجه آخرین اسکن</div>
                <div class="result-content" id="scanResult">
                    هنوز اسکنی انجام نشده
                </div>
                <div class="log-time" id="scanTime"></div>
            </div>
            
            <!-- تاریخچه امروز -->
            <div class="history-card">
                <div class="history-title">
                    📋 تاریخچه امروز
                    <span class="badge" id="todayCount">0</span>
                </div>
                <div id="todayLogs">
                    <div style="text-align: center; padding: 20px; color: #6b7280;">
                        📭 هیچ رویدادی ثبت نشده
                    </div>
                </div>
            </div>
            
            <!-- کنترل‌ها -->
            <div class="controls">
                <button class="control-btn export-btn" onclick="exportData()">
                    📥 خروجی
                </button>
                <button class="control-btn clear-btn" onclick="clearData()">
                    🗑️ پاکسازی
                </button>
                <button class="control-btn test-btn" onclick="testNFC()">
                    🔧 تست
                </button>
            </div>
            
            <!-- راهنما -->
            <div style="margin-top: 20px; padding: 15px; background: #f0f9ff; border-radius: 10px; font-size: 13px; color: #0369a1;">
                <strong>💡 نکته:</strong> مطمئن شوید NFC گوشی فعال است. کارت را آهسته به پشت گوشی نزدیک کنید.
            </div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
